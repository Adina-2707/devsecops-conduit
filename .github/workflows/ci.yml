name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-tests.txt
      - run: python -m pytest tests/unit -v

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --verbose

  build-images:
    needs: [unit-tests, gitleaks]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Name the images
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to the registry
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the API image
        run: >
          docker build backend
          --tag "$REGISTRY/conduit-api:$GITHUB_SHA"
          --build-arg APP_REVISION="$GITHUB_SHA"
          --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY"
      - name: Build the frontend image
        run: >
          docker build frontend
          --tag "$REGISTRY/conduit-web:$GITHUB_SHA"
          --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY"
      - name: Deliver both images
        run: |
          docker push "$REGISTRY/conduit-api:$GITHUB_SHA"
          docker push "$REGISTRY/conduit-web:$GITHUB_SHA"

  deploy:
    needs: [unit-tests, gitleaks]
    # Paused while the server moves to containers (Lesson 7). Lesson 8 turns it back on.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.postgresql
      - name: Give the robot its key
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Release this commit
        run: ansible-playbook -i deploy/inventory.ini deploy/playbook.yml --private-key ~/.ssh/deploy_key -e revision="$GITHUB_SHA"
